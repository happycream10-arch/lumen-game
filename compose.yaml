services:
  lumen:
    build:
      context: .
      dockerfile: standalone/Dockerfile
    environment:
      NODE_ENV: production
      PUBLIC_URL: https://${LUMEN_DOMAIN:?Set LUMEN_DOMAIN in .env}
    volumes:
      - lumen-data:/app/data
    expose:
      - "3000"
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      LUMEN_DOMAIN: ${LUMEN_DOMAIN:?Set LUMEN_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./standalone/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - lumen
    restart: unless-stopped
volumes:
  lumen-data:
  caddy-data:
  caddy-config:
